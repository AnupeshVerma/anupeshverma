<svg xmlns="http://www.w3.org/2000/svg" width="360" height="96" viewBox="0 0 360 96">
  <defs>
    <!-- animated gradient used for border, glow and icon tile -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#e879f9"/>
      <animateTransform attributeName="gradientTransform" type="rotate" values="0 .5 .5;360 .5 .5" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b2e"/>
      <stop offset="100%" stop-color="#0b0f1a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- soft glow -->
  <rect x="20" y="16" width="320" height="64" rx="20" fill="url(#accent)" opacity="0.45" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;0.55;0.3" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- gradient border + card -->
  <rect x="18" y="14" width="324" height="68" rx="20" fill="url(#accent)"/>
  <rect x="19.5" y="15.5" width="321" height="65" rx="18.5" fill="url(#card)"/>

  <!-- icon tile -->
  <rect x="32" y="28" width="40" height="40" rx="12" fill="url(#accent)"/>
  <g transform="translate(52 48)" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-10" y="-8" width="20" height="16" rx="3"/>
    <line x1="-10" y1="-3" x2="10" y2="-3"/>
    <circle cx="-6.5" cy="-5.5" r="0.4" fill="#ffffff"/>
    <circle cx="-4" cy="-5.5" r="0.4" fill="#ffffff"/>
    <path d="M-4 3 L-1 0.5 L1.5 3 L5 -0.5"/>
  </g>

  <!-- text -->
  <text x="86" y="43" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="1.6" fill="#8b949e">EXPLORE MY WORK</text>
  <text x="86" y="64" font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#f0f6fc">View Portfolio</text>

  <!-- arrow chip -->
  <circle cx="310" cy="48" r="16" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.18"/>
  <g transform="translate(310 48)" fill="none" stroke="#f0f6fc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <g>
      <path d="M-4.5 4.5 L4.5 -4.5 M-2 -4.5 H4.5 V2"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;1.8 -1.8;0 0" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
